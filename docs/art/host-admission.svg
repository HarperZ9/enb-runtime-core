<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 564" width="960" height="564" font-family="Hanken Grotesk, Segoe UI, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Eight stages taking a loaded module to an admitted host: snapshot, anchor, exports, SDK report, render info, module path, fingerprint, allowlist. The platform adapter snapshots only the modules already present in the process, and the library never loads one. A module with no anchor is ignored, and a partial or ambiguous snapshot fails closed rather than guessing. Eight typed export names are resolved from the surviving handle, and all eight are required. The SDK report is admitted for versions 1002 through 1999 with game identifier 0x10000006. A host that has not published render information yet returns NotReady together with its complete export table, so deferred bootstrap can retry without treating readiness as incompatibility. Package identity is a separate gate: the full module path is taken from the resolved handle, the existing file is streamed through SHA-256, and its byte size, PE machine, four-part FileVersion and OriginalFilename are read from the version resource. The immutable allowlist holds one captured build. A complete but unlisted observation is an unknown build, and missing or malformed evidence stays unavailable. Three outcomes: admitted against one captured build, admitted audit-only with the evidence still named unknown, and refused when there is no module to resolve."><style>
  :root{ --void:#f4f3ef; --bone:#0b0c0e; --muted:#43474e;
    --hairline:rgba(11,12,14,.16); --card:rgba(255,255,255,.66);
    --verified:#1f7a52; --drift:#3a2bd6; }
  @media (prefers-color-scheme: dark){
    :root{ --void:#0b0e0f; --bone:#eef1ee; --muted:#9aa39c;
      --hairline:rgba(238,241,238,.18); --card:rgba(255,255,255,.05);
      --verified:#5fae93; --drift:#a99cf5; } }
  .bg{ fill:var(--void); }
  .card{ fill:var(--card); stroke:var(--hairline); stroke-width:1.4; }
  .n{ fill:var(--bone); font-size:15px; font-weight:650; }
  .s{ fill:var(--muted); font-size:11.5px; }
  .k{ fill:var(--muted); font-size:11px; letter-spacing:.16em; }
  .h{ fill:var(--bone); font-size:21px; font-weight:700; }
  .fwd{ stroke:var(--verified); stroke-width:2; fill:none; }
  .back{ stroke:var(--drift); stroke-width:1.8; fill:none; stroke-dasharray:5 4; }
  .thin{ stroke:var(--hairline); stroke-width:1.4; fill:none; }
  .step{ fill:var(--muted); font-size:11px; font-weight:700; letter-spacing:.1em; }
</style><marker id="af" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--verified)"/></marker><marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--drift)"/></marker><rect class="bg" width="960" height="564"/><text class="k" x="44" y="40" font-family="Conso, ui-monospace, Cascadia Mono, Consolas, monospace">AN ENB MODULE IN THE PROCESS IS NOT YET A HOST THIS LIBRARY WILL TALK TO</text><text class="h" x="44" y="72">How an already-loaded ENB module is admitted, or refused</text><path class="fwd" marker-end="url(#af)" d="M246.5 158H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 158H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 158H710.5"/><path class="fwd" marker-end="url(#af)" d="M920 158H940V276H20V350H37"/><path class="fwd" marker-end="url(#af)" d="M246.5 350H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 350H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 350H710.5"/><path class="back" marker-end="url(#ab)" d="M592.25 206V228H143.25V213"/><text class="k" x="367.75" y="245" text-anchor="middle" fill="var(--drift)">A PARTIAL SNAPSHOT FAILS CLOSED</text><path class="back" marker-end="url(#ab)" d="M816.75 398V420H367.75V405"/><text class="k" x="592.25" y="437" text-anchor="middle" fill="var(--drift)">UNKNOWN EVIDENCE STAYS UNKNOWN</text><g><rect class="card" x="44" y="110" width="198.5" height="96" rx="3"/><text class="step" x="58" y="101">01</text><text class="n" x="58" y="142">Snapshot</text><text class="s" x="58" y="168">Modules already in the</text><text class="s" x="58" y="183">process.</text></g><g><rect class="card" x="268.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="101">02</text><text class="n" x="282.5" y="142">Anchor</text><text class="s" x="282.5" y="168">An anchorless module is</text><text class="s" x="282.5" y="183">ignored.</text></g><g><rect class="card" x="493" y="110" width="198.5" height="96" rx="3"/><text class="step" x="507" y="101">03</text><text class="n" x="507" y="142">Exports</text><text class="s" x="507" y="168">Eight typed names, or none.</text></g><g><rect class="card" x="717.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="101">04</text><text class="n" x="731.5" y="142">SDK report</text><text class="s" x="731.5" y="168">1002 to 1999, and one game id.</text></g><g><rect class="card" x="44" y="302" width="198.5" height="96" rx="3"/><text class="step" x="58" y="293">05</text><text class="n" x="58" y="334">Render info</text><text class="s" x="58" y="360">Not ready keeps the export</text><text class="s" x="58" y="375">table.</text></g><g><rect class="card" x="268.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="293">06</text><text class="n" x="282.5" y="334">Module path</text><text class="s" x="282.5" y="360">The file on disk, never</text><text class="s" x="282.5" y="375">loaded.</text></g><g><rect class="card" x="493" y="302" width="198.5" height="96" rx="3"/><text class="step" x="507" y="293">07</text><text class="n" x="507" y="334">Fingerprint</text><text class="s" x="507" y="360">SHA-256, size, machine,</text><text class="s" x="507" y="375">version.</text></g><g><rect class="card" x="717.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="293">08</text><text class="n" x="731.5" y="334">Allowlist</text><text class="s" x="731.5" y="360">One captured build admitted.</text></g><path class="thin" d="M816.75 398V448"/><path class="thin" d="M816.75 448H180.67V472"/><rect x="44" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--verified)" stroke-width="1.6"/><text class="n" x="58" y="493" font-size="13">ADMITTED</text><text class="s" x="58" y="509" font-size="10.5">one captured build, hash exact</text><path class="thin" d="M816.75 448H480V472"/><rect x="343.33" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--drift)" stroke-width="1.6"/><text class="n" x="357.33" y="493" font-size="13">AUDIT ONLY</text><text class="s" x="357.33" y="509" font-size="10.5">unlisted, and named as unlisted</text><path class="thin" d="M816.75 448H779.33V472"/><rect x="642.67" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--muted)" stroke-width="1.6"/><text class="n" x="656.67" y="493" font-size="13">REFUSED</text><text class="s" x="656.67" y="509" font-size="10.5">no ENB module to resolve</text><text class="s" x="44" y="546">Two gates, deliberately separate. The first asks whether the module speaks the SDK: eight typed exports, a version inside the admitted family, and one game identifier. The second asks which build it is, from the file on disk rather than from anything the module reports about itself. An admitted SDK report grants no package identity, and evidence nobody can read stays unknown rather than being rounded to a build.</text></svg>
