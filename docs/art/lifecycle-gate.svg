<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 564" width="960" height="564" font-family="Hanken Grotesk, Segoe UI, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Eight stages holding a save: bootstrap, activate, begin save, quiesce, nested, outcome, reapply pending, active again. The gate starts in inactive bootstrap with product mutation denied, and Active is the only state that permits a write. A first BeginSave from Active requires the caller to acknowledge that baseline restoration completed, and the gate then atomically records quiesce requested, baseline restored, and save in progress. Nested saves retain the save state until every matching outcome has arrived. SaveSucceeded, SaveFailed and SaveCancelled all converge on reapply pending after the outermost outcome, and mutation stays denied there. Only ReapplyAtVerifiedBarrier returns the gate to Active, incrementing the application generation exactly once. Shutdown and interruption paths retain mutation denial, and starting either from Active requires the same restoration acknowledgement. A rejected event carries a diagnostic code and changes no state. Three outcomes: mutation permitted only in the active state, reapply pending while the gate waits on a verified barrier, and denied in every other state."><style>
  :root{ --void:#f4f3ef; --bone:#0b0c0e; --muted:#43474e;
    --hairline:rgba(11,12,14,.16); --card:rgba(255,255,255,.66);
    --verified:#1f7a52; --drift:#3a2bd6; }
  @media (prefers-color-scheme: dark){
    :root{ --void:#0b0e0f; --bone:#eef1ee; --muted:#9aa39c;
      --hairline:rgba(238,241,238,.18); --card:rgba(255,255,255,.05);
      --verified:#5fae93; --drift:#a99cf5; } }
  .bg{ fill:var(--void); }
  .card{ fill:var(--card); stroke:var(--hairline); stroke-width:1.4; }
  .n{ fill:var(--bone); font-size:15px; font-weight:650; }
  .s{ fill:var(--muted); font-size:11.5px; }
  .k{ fill:var(--muted); font-size:11px; letter-spacing:.16em; }
  .h{ fill:var(--bone); font-size:21px; font-weight:700; }
  .fwd{ stroke:var(--verified); stroke-width:2; fill:none; }
  .back{ stroke:var(--drift); stroke-width:1.8; fill:none; stroke-dasharray:5 4; }
  .thin{ stroke:var(--hairline); stroke-width:1.4; fill:none; }
  .step{ fill:var(--muted); font-size:11px; font-weight:700; letter-spacing:.1em; }
</style><marker id="af" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--verified)"/></marker><marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--drift)"/></marker><rect class="bg" width="960" height="564"/><text class="k" x="44" y="40" font-family="Conso, ui-monospace, Cascadia Mono, Consolas, monospace">A SAVE THAT LANDS ON TOP OF A MUTATED ENGINE IS THE FAILURE THIS EXISTS TO PREVENT</text><text class="h" x="44" y="72">How the lifecycle gate holds a save and gives the engine back</text><path class="fwd" marker-end="url(#af)" d="M246.5 158H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 158H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 158H710.5"/><path class="fwd" marker-end="url(#af)" d="M920 158H940V276H20V350H37"/><path class="fwd" marker-end="url(#af)" d="M246.5 350H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 350H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 350H710.5"/><path class="back" marker-end="url(#ab)" d="M592.25 206V228H143.25V213"/><text class="k" x="367.75" y="245" text-anchor="middle" fill="var(--drift)">A REJECTED EVENT CHANGES NO STATE</text><path class="back" marker-end="url(#ab)" d="M592.25 398V420H143.25V405"/><text class="k" x="367.75" y="437" text-anchor="middle" fill="var(--drift)">NESTED SAVES HOLD THE SAVE STATE</text><g><rect class="card" x="44" y="110" width="198.5" height="96" rx="3"/><text class="step" x="58" y="101">01</text><text class="n" x="58" y="142">Bootstrap</text><text class="s" x="58" y="168">Nine states. Mutation denied.</text></g><g><rect class="card" x="268.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="101">02</text><text class="n" x="282.5" y="142">Activate</text><text class="s" x="282.5" y="168">The one state that permits a</text><text class="s" x="282.5" y="183">write.</text></g><g><rect class="card" x="493" y="110" width="198.5" height="96" rx="3"/><text class="step" x="507" y="101">03</text><text class="n" x="507" y="142">Begin save</text><text class="s" x="507" y="168">Baseline restoration</text><text class="s" x="507" y="183">acknowledged.</text></g><g><rect class="card" x="717.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="101">04</text><text class="n" x="731.5" y="142">Quiesce</text><text class="s" x="731.5" y="168">Requested, restored, in</text><text class="s" x="731.5" y="183">progress.</text></g><g><rect class="card" x="44" y="302" width="198.5" height="96" rx="3"/><text class="step" x="58" y="293">05</text><text class="n" x="58" y="334">Nested</text><text class="s" x="58" y="360">Every matching outcome must</text><text class="s" x="58" y="375">arrive.</text></g><g><rect class="card" x="268.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="293">06</text><text class="n" x="282.5" y="334">Outcome</text><text class="s" x="282.5" y="360">Succeeded, failed or</text><text class="s" x="282.5" y="375">cancelled.</text></g><g><rect class="card" x="493" y="302" width="198.5" height="96" rx="3"/><text class="step" x="507" y="293">07</text><text class="n" x="507" y="334">Reapply</text><text class="s" x="507" y="360">Denied until a verified</text><text class="s" x="507" y="375">barrier.</text></g><g><rect class="card" x="717.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="293">08</text><text class="n" x="731.5" y="334">Active again</text><text class="s" x="731.5" y="360">Generation moves exactly once.</text></g><path class="thin" d="M816.75 398V448"/><path class="thin" d="M816.75 448H180.67V472"/><rect x="44" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--verified)" stroke-width="1.6"/><text class="n" x="58" y="493" font-size="13">MUTATION PERMITTED</text><text class="s" x="58" y="509" font-size="10.5">the active state, and only it</text><path class="thin" d="M816.75 448H480V472"/><rect x="343.33" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--drift)" stroke-width="1.6"/><text class="n" x="357.33" y="493" font-size="13">REAPPLY PENDING</text><text class="s" x="357.33" y="509" font-size="10.5">waiting on a verified barrier</text><path class="thin" d="M816.75 448H779.33V472"/><rect x="642.67" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--muted)" stroke-width="1.6"/><text class="n" x="656.67" y="493" font-size="13">DENIED</text><text class="s" x="656.67" y="509" font-size="10.5">every other state, failed included</text><text class="s" x="44" y="546">The gate never infers a save outcome from a frame callback. A first BeginSave from Active requires the caller to acknowledge that baseline restoration completed, nested saves hold the save state until every matching outcome has arrived, and only ReapplyAtVerifiedBarrier returns the gate to Active. The generation counter moves exactly once on that return, so a caller can tell a reapplied run from the one before it.</text></svg>
